<!--
  Chordsheet icon artwork (512 × 512, full bleed): "Accordo" — two lines of
  lyrics with a small amber mark above each (a chord over a syllable), on a
  warm dark glass surface that fills the whole icon.
  The symbol is the group id="symbol": make-variants.mjs scales only that for
  the maskable icon, so the glass always reaches the edges.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- The surface: warm amber-tinted dark, lighter in the middle. -->
    <radialGradient id="bg" cx="50%" cy="38%" r="85%">
      <stop offset="0" stop-color="#4A3420"/>
      <stop offset="0.5" stop-color="#25190F"/>
      <stop offset="1" stop-color="#110C08"/>
    </radialGradient>
    <!-- Amber light from behind the symbol. -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F2B45C" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#E08A2E" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#E08A2E" stop-opacity="0"/>
    </radialGradient>
    <!-- Glass: a sheen across the top, warm light along the bottom edge. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2B45C" stop-opacity="0"/>
      <stop offset="1" stop-color="#F2B45C" stop-opacity="0.22"/>
    </linearGradient>
    <!-- userSpaceOnUse: a bounding-box gradient can't paint a straight line (its box has no height). -->
    <linearGradient id="amber" gradientUnits="userSpaceOnUse" x1="0" y1="140" x2="0" y2="380">
      <stop offset="0" stop-color="#FFD99A"/>
      <stop offset="0.5" stop-color="#F3AE4E"/>
      <stop offset="1" stop-color="#D47F27"/>
    </linearGradient>
    <linearGradient id="cream" gradientUnits="userSpaceOnUse" x1="0" y1="140" x2="0" y2="380">
      <stop offset="0" stop-color="#FFF5E4"/>
      <stop offset="1" stop-color="#E7D2AF"/>
    </linearGradient>
    <filter id="b40" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="b12" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="270" r="230" fill="url(#glow)" filter="url(#b40)"/>
  <rect y="360" width="512" height="152" fill="url(#floor)"/>

  <g id="symbol">
    <!-- the amber marks, with their glow -->
    <g fill="url(#amber)" opacity="0.6" filter="url(#b12)">
      <rect x="123.5" y="154" width="55" height="27.5" rx="13.75"/>
      <rect x="301" y="279" width="55" height="27.5" rx="13.75"/>
    </g>
    <g fill="url(#amber)">
      <rect x="123.5" y="154" width="55" height="27.5" rx="13.75"/>
      <rect x="301" y="279" width="55" height="27.5" rx="13.75"/>
    </g>
    <!-- the two lines -->
    <g stroke="url(#cream)" stroke-width="17.5" stroke-linecap="round">
      <line x1="123.5" y1="221.5" x2="388.5" y2="221.5"/>
      <line x1="123.5" y1="346.5" x2="336" y2="346.5"/>
    </g>
  </g>

  <path d="M0 0 H512 V250 Q256 300 0 250 Z" fill="url(#sheen)"/>
</svg>
