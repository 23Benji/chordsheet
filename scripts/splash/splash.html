<!doctype html>
<!--
  Launch screen artwork, rendered once per iPhone/iPad size by make-splash.mjs.
  Since 1.36 it is only the background of the opening animation (warm in the
  middle, darker at the edges — the same as #boot in index.html and the
  Intro component), so the animation starts from it without a jump. No icon:
  the logo is built by the animation itself.
  ?w=&h= are the CSS size of the screen, ?k= how much larger the window is
  (Chrome won't make a window narrower than ~500 px, so phones are drawn at
  2× with zoom: the layout is still exactly w × h).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      body {
        /* Size set by the script: exactly the screen, in CSS px. */
        width: var(--w);
        height: var(--h);
        /* --intro-bg-center, --bg (dark), --intro-bg-edge */
        background: radial-gradient(120% 70% at 50% 42%, #2a1d12, #14100d 60%, #0e0b09);
      }
    </style>
  </head>
  <body>
    <script>
      const q = new URLSearchParams(location.search);
      const w = Number(q.get('w')) || 390;
      const h = Number(q.get('h')) || 844;
      const k = Number(q.get('k')) || 1;
      const s = document.body.style;
      s.setProperty('--w', `${w}px`);
      s.setProperty('--h', `${h}px`);
      document.documentElement.style.zoom = String(k);
    </script>
  </body>
</html>
