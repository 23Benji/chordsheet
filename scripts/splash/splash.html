<!doctype html>
<!--
  Launch screen artwork, rendered once per iPhone/iPad size by make-splash.mjs:
  the app's dark background, the icon, the name in the app's heading font.
  ?w=&h= are the CSS size of the screen.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Caladea';
        font-weight: 700;
        src: url('../../node_modules/@fontsource/caladea/files/caladea-latin-700-normal.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14100d; /* --bg of the dark theme */
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        /* Optical centre: a little above the middle. */
        padding-bottom: 6vh;
        box-sizing: border-box;
      }
      img {
        width: var(--icon);
        height: var(--icon);
      }
      p {
        margin: 0;
        color: #f6efe4; /* --text */
        font: 700 var(--name) / 1 'Caladea', Georgia, serif;
        letter-spacing: 0.01em;
      }
    </style>
  </head>
  <body>
    <img src="../icon/icon.svg" alt="" />
    <p>Chordsheet</p>
    <script>
      const w = Number(new URLSearchParams(location.search).get('w')) || 390;
      const big = w >= 700;
      document.body.style.setProperty('--icon', big ? '168px' : '120px');
      document.body.style.setProperty('--name', big ? '40px' : '30px');
    </script>
  </body>
</html>
