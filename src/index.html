<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <title>Chordsheet</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14100D" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script>
      // iPhone status bar: iOS reads its style as the app starts, before Angular
      // has loaded the theme, so the last choice is kept in localStorage
      // (written by SettingsService): white bar for light themes, black for dark.
      try {
        var bar = localStorage.getItem('innario.statusBar');
        if (bar === 'default') document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', bar);
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-title" content="Chordsheet" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Per usare Chordsheet attiva JavaScript.</noscript>
  </body>
</html>
