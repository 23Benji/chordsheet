@if ((library.isEmpty() || layout.holdWelcome()) && !layout.forceShell()) {
  <!-- Only needed with an empty library: downloaded separately (the service worker keeps it offline). -->
  @defer (on immediate) {
    <app-welcome />
  }
} @else if (library.loaded()) {
  <div class="shell" [class.sidebar-closed]="!libraryShown()" [class.from-welcome]="layout.fromWelcome()">
    <app-library-sidebar class="sidebar" [attr.inert]="libraryShown() ? null : ''" />
    <div class="scrim" (click)="layout.sidebarOpen.set(false)" aria-hidden="true"></div>
    <main class="main">
      <router-outlet />
    </main>
  </div>

  <!-- iPhone: bottom navigation bar (Impostazioni is in the library's floating "+" menu) -->
  <nav class="bottom-bar" [class.hidden]="bottomBarHidden()" [class.from-welcome]="layout.fromWelcome()" [attr.aria-label]="t.nav">
    <button type="button" class="tab" [class.selected]="section() === 'library'" (click)="openLibrary()">
      <app-icon name="library" /><span>{{ t.library }}</span>
    </button>
    <a class="tab" routerLink="/scalette" [class.selected]="section() === 'setlists'" (click)="layout.sidebarOpen.set(false)">
      <app-icon name="list" /><span>{{ t.setlists }}</span>
    </a>
  </nav>
}

@if (toast.toast(); as current) {
  <div class="toast" role="status" (click)="toast.dismiss()">
    <span>{{ current.message }}</span>
    @if (current.action; as action) {
      <button type="button" class="btn btn-primary toast-action" (click)="$event.stopPropagation(); toast.runAction()">
        {{ action.label }}
      </button>
    }
  </div>
}

<!-- Opening animation, over everything while the app gets ready underneath. -->
@if (layout.introPlaying()) {
  <app-intro (finished)="layout.introPlaying.set(false)" />
}
