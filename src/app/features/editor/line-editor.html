<!--
  Chord gap (only on a line without chords inside a passage with chords): a
  strip where the chords would go. Its label switches whether the song keeps
  that space above the line; the rest of the strip still adds chords.
-->
@if (gap(); as g) {
  <div class="gap-strip" [class.on]="g.on" aria-hidden="true"></div>
  <button
    type="button"
    class="gap-label"
    [class.on]="g.on"
    [attr.aria-pressed]="g.on"
    [attr.aria-label]="g.on ? t.gapOnAria : t.gapOffAria"
    [title]="g.on ? t.gapOnAria : t.gapOffAria"
    (mousedown)="$event.preventDefault()"
    (click)="gapToggled.emit()"
  >{{ g.on ? t.gapOn : t.gapOff }}</button>
}
<div class="scroller" #scroller>
  <div class="grid" [style.width.ch]="widthCh()">
    <span class="measure" #measure aria-hidden="true">0000000000</span>
    <div class="chord-row" (pointerdown)="onRowPointerDown($event)" [title]="t.chordRow">
      @for (chip of chips(); track chip.id) {
        <!-- "chord-chip", not "chip": the global .chip (pill buttons) has a
             min-height that pushed the chord away from its letter. -->
        <button
          type="button"
          class="chord-chip"
          [style.left.ch]="chip.left"
          [attr.aria-label]="t.chordAria(chip.chord)"
          (pointerdown)="onChipPointerDown($event, chip)"
          (pointermove)="onChipPointerMove($event)"
          (pointerup)="onChipPointerUp(chip)"
          (keydown)="onChipKeydown($event, chip)"
        >{{ chip.chord }}</button>
      }
    </div>
    <input
      #text
      class="text"
      type="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      [attr.aria-label]="t.lyricsAria"
      [value]="line().text"
      (input)="onInput(text.value)"
      (keydown)="onTextKeydown($event)"
    />
  </div>
</div>

@if (popover(); as p) {
  <div class="popover" [style.left.px]="p.leftPx" (keydown.escape)="closePopover()">
    <input
      #chordInput
      class="chord-input"
      type="text"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      [value]="p.value"
      [placeholder]="t.chordPopover.placeholder"
      (keydown.enter)="confirmPopover(chordInput.value)"
    />
    @if (p.chordId) {
      <!-- Move by one letter: much easier than dragging with a finger. -->
      <div class="nudge">
        <button type="button" class="btn icon-btn" (click)="nudge(-1)" [attr.aria-label]="t.chordPopover.left" [title]="t.chordPopover.left">
          <app-icon name="chevronLeft" />
        </button>
        <span class="nudge-label">{{ t.chordPopover.move }}</span>
        <button type="button" class="btn icon-btn" (click)="nudge(1)" [attr.aria-label]="t.chordPopover.right" [title]="t.chordPopover.right">
          <app-icon name="chevronRight" />
        </button>
      </div>
    }
    @if (palette().length) {
      <div class="palette" [attr.aria-label]="t.chordPopover.palette">
        @for (chord of palette(); track chord) {
          <button type="button" class="pal" (click)="confirmPopover(chord)">{{ chord }}</button>
        }
      </div>
    }
    <div class="pop-actions">
      @if (p.chordId) {
        <button type="button" class="btn danger" (click)="removeFromPopover()">{{ t.chordPopover.remove }}</button>
      }
      <button type="button" class="btn" (click)="closePopover()">{{ t.chordPopover.cancel }}</button>
      <button type="button" class="btn btn-primary" (click)="confirmPopover(chordInput.value)">
        {{ t.chordPopover.ok }}
      </button>
    </div>
  </div>
}
